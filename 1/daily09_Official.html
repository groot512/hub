<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        daily: {
                            main: '#21A745',    // 메인 그린
                            light: '#6FC320',   // 밝은 그린 (라임)
                            dark: '#003D33',    // 깊은 그린 (헤더/푸터)
                            black: '#232A21',   // 텍스트용 블랙
                            orange: '#FF8F00',  // 포인트 오렌지

                }
            }
        }

    <!-- 2. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-white text-daily-black">
    <div id="root"></div>

            ShoppingBag: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,

            Truck: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>,
            Leaf: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>,
            Menu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            X: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Settings: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,

        };

            const [activeTab, setActiveTab] = useState('hq');
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setIsMenuOpen(false);
                }
            };

            const features = {
                hq: {
                    title: "브랜드 관리자 (HQ)",
                    desc: "전사 공급망과 가맹점 현황을 한눈에 파악하고 통제합니다.",
                    image: "https://iamgroot5.notion.site/image/attachment%3A27d00907-04da-49f5-baf6-ba878b7ad911%3Aimage.png?table=block&id=2ff58bed-44e2-8038-8415-ce58ef8199cd&spaceId=2ffdea8a-3eef-4ada-b61e-cbe4fc05491a&width=2000&userId=&cache=v2", 
                    items: [
                        { icon: <Icons.Box size={18} />, text: "상품 마스터 등록 및 전체 조회" },
                        { icon: <Icons.Store size={18} />, text: "가맹점 리스트 통합 관리" },
                        { icon: <Icons.Settings size={18} />, text: "카테고리 및 기본 환경 설정" },
                        { icon: <Icons.TrendingUp size={18} />, text: "실시간 발주/출고 현황 모니터링" }
                    ]
                },
                manager: {
                    title: "매장 관리자 (Manager)",
                    desc: "복잡한 매장 운영을 대시보드 하나로 간편하게 해결합니다.",
                    image: "https://iamgroot5.notion.site/image/attachment%3Ab96751ea-c3a5-4980-af16-3a61c1561459%3Aimage.png?table=block&id=2ff58bed-44e2-80de-a4a7-c0bd3e66820d&spaceId=2ffdea8a-3eef-4ada-b61e-cbe4fc05491a&width=2000&userId=&cache=v2", 
                    items: [
                        { icon: <Icons.LayoutDashboard size={18} />, text: "매장 현황 대시보드 (매출, 픽업)" },
                        { icon: <Icons.Box size={18} />, text: "재고 부담 없는 주문/공구 체크" },
                        { icon: <Icons.Users size={18} />, text: "단골 고객 회원 관리 (CRM)" },
                        { icon: <Icons.MessageSquare size={18} />, text: "픽업 알림 메시지 자동 발송" }
                    ]
                },
                user: {
                    title: "사용자 앱 (User App)",
                    desc: "동네 거점을 통해 배송비 없이 신선식품을 공동구매합니다.",
                    image: "https://iamgroot5.notion.site/image/attachment%3A04ad6ac9-face-4c14-9a10-4f56a88e187c%3A08f29202-ecfb-4bca-873e-4c156975cf72.png?table=block&id=2ff58bed-44e2-80d3-a949-c75f43a641ef&spaceId=2ffdea8a-3eef-4ada-b61e-cbe4fc05491a&width=2000&userId=&cache=v2", 
                    isMobile: true,
                    items: [
                        { icon: <Icons.Store size={18} />, text: "우리 동네 매장 소개 및 소식" },
                        { icon: <Icons.ShoppingBag size={18} />, text: "간편한 공동구매 참여 및 내역" },
                        { icon: <Icons.MessageSquare size={18} />, text: "카카오 계정 연동 간편 로그인" },
                        { icon: <Icons.Users size={18} />, text: "마이페이지를 통한 개인화 경험" }
                    ]
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans overflow-x-hidden">
                    {/* 네비게이션 */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-white/95 backdrop-blur-md shadow-md py-4' : 'bg-transparent py-6'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>

                                <span className={`text-2xl font-black tracking-tighter ${isScrolled ? 'text-daily-black' : 'text-white'}`}>daily09</span>
                            </div>
                            
                            <div className="hidden md:flex gap-8 items-center">
                                {['About', 'Features', 'System', 'Contact'].map((item) => (

                                        onClick={() => scrollToSection(item.toLowerCase())}
                                        className={`text-sm font-medium hover:text-daily-main transition-colors ${isScrolled ? 'text-gray-600' : 'text-gray-200'}`}
                                    >

                                    </button>
                                ))}

                            </div>

                            <div className="md:hidden">
                                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className={isScrolled ? 'text-daily-black' : 'text-white'}>
                                    {isMenuOpen ? <Icons.X /> : <Icons.Menu />}
                                </button>
                            </div>
                        </div>

                                    <button 
                                        key={item}
                                        onClick={() => scrollToSection(item.toLowerCase())}
                                        className="text-left text-daily-black font-medium py-2 border-b border-gray-100"
                                    >
                                        {item}
                                    </button>
                                ))}
                            </div>
                        )}
                    </nav>

                    {/* 헤더 섹션 */}
                    <header className="relative min-h-[90vh] flex items-center bg-daily-dark text-white overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2574&auto=format&fit=crop')] bg-cover bg-center opacity-20"></div>

                                </h1>
                                <p className="text-xl text-gray-300 max-w-lg leading-relaxed">

                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                    <button onClick={() => scrollToSection('features')} className="bg-daily-main hover:bg-[#1a8a38] text-white px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-daily-main/50 flex items-center justify-center gap-2">
                                        시스템 둘러보기 <Icons.ArrowRight size={20} />
                                    </button>
                                    <button 
                                        onClick={() => window.open('https://drive.google.com/file/d/11dYZPZd2brfuSa4Wny1UdmunOky4hQUa/view?usp=sharing', '_blank')}
                                        className="bg-daily-orange hover:bg-orange-600 text-white border border-transparent px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-orange-500/30">
                                        서비스 소개서 PDF
                                    </button>
                                </div>
                            </div>
                            
                            <div className="relative hidden lg:block">
                                 <div className="relative w-full h-[500px]">
                                    <div className="absolute top-10 right-10 w-64 h-80 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-4 transform rotate-6 z-10">
                                        <div className="h-full bg-gray-900 rounded-xl overflow-hidden relative">
                                            {/* 사용자 앱 이미지 */}
                                            <img src="https://iamgroot5.notion.site/image/attachment%3A04ad6ac9-face-4c14-9a10-4f56a88e187c%3A08f29202-ecfb-4bca-873e-4c156975cf72.png?table=block&id=2ff58bed-44e2-80d3-a949-c75f43a641ef&spaceId=2ffdea8a-3eef-4ada-b61e-cbe4fc05491a&width=2000&userId=&cache=v2" alt="App Screen" className="w-full h-full object-cover opacity-90" onError={(e) => {e.target.style.display='none'; e.target.nextSibling.style.display='flex'}} />
                                            <div className="absolute inset-0 hidden items-center justify-center text-gray-500 text-xs text-center p-4">이미지 없음</div>
                                        </div>
                                    </div>
                                    <div className="absolute top-20 left-10 w-[400px] h-[300px] bg-white rounded-2xl shadow-2xl p-2 transform -rotate-3 z-20">
                                        <div className="h-full bg-gray-50 rounded-xl overflow-hidden relative">
                                            <img src="https://iamgroot5.notion.site/image/attachment%3Ab96751ea-c3a5-4980-af16-3a61c1561459%3Aimage.png?table=block&id=2ff58bed-44e2-80de-a4a7-c0bd3e66820d&spaceId=2ffdea8a-3eef-4ada-b61e-cbe4fc05491a&width=2000&userId=&cache=v2" alt="Dashboard Screen" className="w-full h-full object-cover object-top" onError={(e) => {e.target.style.display='none'; e.target.nextSibling.style.display='flex'}} />
                                            <div className="absolute inset-0 hidden items-center justify-center text-gray-400 text-xs -z-10 bg-gray-100 text-center p-4">이미지 없음</div>
                                        </div>
                                    </div>
                                 </div>
                            </div>
                        </div>
                    </header>

                    {/* 기능 소개 섹션 */}
                    <section id="features" className="py-24 bg-gray-50">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-16">
                                <h2 className="text-sm font-bold text-daily-main tracking-widest uppercase mb-3">System Architecture</h2>
                                <h3 className="text-3xl md:text-4xl font-bold text-daily-black">
                                    하나로 연결된 <span className="text-daily-main">통합 플랫폼</span>
                                </h3>
                                <p className="mt-4 text-gray-600 max-w-2xl mx-auto">
                                    본사, 가맹점, 고객이 유기적으로 연결되어 최적의 효율을 만들어냅니다.
                                </p>
                            </div>

                            <div className="flex justify-center mb-12">
                                <div className="bg-white p-1.5 rounded-xl shadow-lg border border-gray-100 inline-flex">
                                    {Object.keys(features).map((key) => (
                                        <button
                                            key={key}
                                            onClick={() => setActiveTab(key)}
                                            className={`px-6 py-3 rounded-lg text-sm font-bold transition-all duration-300 flex items-center gap-2 ${
                                                activeTab === key 
                                                ? 'bg-daily-black text-white shadow-md' 
                                                : 'text-gray-500 hover:text-daily-black hover:bg-gray-50'
                                            }`}
                                        >
                                            {key === 'hq' && <Icons.LayoutDashboard size={18} />}
                                            {key === 'manager' && <Icons.Store size={18} />}
                                            {key === 'user' && <Icons.Smartphone size={18} />}
                                            {features[key].title.split(' ')[0]}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                                <div className="grid lg:grid-cols-2 min-h-[600px]">
                                    
                                    <div className="p-10 md:p-16 flex flex-col justify-center">
