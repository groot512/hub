<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 회원 현황 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-900 text-white p-6 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">📊 통신사 회원 현황 대시보드</h1>
                <p class="text-indigo-200 text-sm mt-1">데이터 기준: 2026-01-29 11:35 AM</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <p class="text-xs opacity-70">Generated by Jarvis</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="card p-6 border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-medium">총 회원 수</h3>
                <p class="text-3xl font-bold mt-2" id="totalMembers">0</p>
                <p class="text-xs text-gray-400 mt-1">전체 가입자 합계</p>
            </div>
            <div class="card p-6 border-l-4 border-indigo-500">
                <h3 class="text-gray-500 text-sm font-medium">최다 가입 통신사</h3>
                <p class="text-3xl font-bold mt-2" id="topCarrier">-</p>
                <p class="text-xs text-gray-400 mt-1" id="topCarrierCount">0명</p>
            </div>
            <div class="card p-6 border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-medium">최다 회원 유형</h3>
                <p class="text-3xl font-bold mt-2" id="topType">-</p>
                <p class="text-xs text-gray-400 mt-1" id="topTypeCount">0명</p>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Pie Chart: Carrier Share -->
            <div class="card p-6">
                <h3 class="text-lg font-bold mb-4 text-gray-700">📡 통신사별 점유율</h3>
                <div class="relative h-64 w-full">
                    <canvas id="carrierChart"></canvas>
                </div>
            </div>

            <!-- Bar Chart: Member Type -->
            <div class="card p-6">
                <h3 class="text-lg font-bold mb-4 text-gray-700">👥 회원 타입별 분포</h3>
                <div class="relative h-64 w-full">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tables Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Summary Table (Carrier Totals) -->
            <div class="card p-6 lg:col-span-1">
                <h3 class="text-lg font-bold mb-4 text-gray-700 flex items-center">
                    <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">요약</span>
                    통신사별 합계
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                            <tr>
                                <th scope="col" class="px-4 py-3">통신사</th>
                                <th scope="col" class="px-4 py-3 text-right">합계</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody">
                            <!-- JS Injection -->
                        </tbody>
                        <tfoot class="font-bold bg-gray-100 text-gray-900">
                            <tr>
                                <td class="px-4 py-3">총계</td>
                                <td class="px-4 py-3 text-right" id="summaryTotal">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Detailed Table -->
            <div class="card p-6 lg:col-span-2">
                <h3 class="text-lg font-bold mb-4 text-gray-700">📋 상세 데이터</h3>
                <div class="overflow-x-auto max-h-96">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                            <tr>
                                <th scope="col" class="px-6 py-3">회원타입</th>
                                <th scope="col" class="px-6 py-3">통신사</th>
                                <th scope="col" class="px-6 py-3 text-right">회원 수</th>
                            </tr>
                        </thead>
                        <tbody id="detailTableBody" class="divide-y divide-gray-200">
                            <!-- JS Injection -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center p-6 text-gray-500 text-sm">
        &copy; 2026 Jarvis Data Solutions. All rights reserved.
    </footer>

    <script>
        // 1. Raw Data Input
        const rawData = [
            { type: "보훈대상자", carrier: "SKT", count: 4059 },
            { type: "보훈대상자", carrier: "KT", count: 2538 },
            { type: "보훈대상자", carrier: "LG U+", count: 1784 },
            { type: "보훈대상자", carrier: "SKT 알뜰폰", count: 148 },
            { type: "보훈대상자", carrier: "KT 알뜰폰", count: 318 },
            { type: "보훈대상자", carrier: "LG U+ 알뜰폰", count: 329 },
            { type: "보훈가족", carrier: "SKT", count: 1495 },
            { type: "보훈가족", carrier: "KT", count: 1020 },
            { type: "보훈가족", carrier: "LG U+", count: 657 },
            { type: "보훈가족", carrier: "SKT 알뜰폰", count: 81 },
            { type: "보훈가족", carrier: "KT 알뜰폰", count: 194 },
            { type: "보훈가족", carrier: "LG U+ 알뜰폰", count: 224 },
            { type: "제대군인", carrier: "SKT", count: 4864 },
            { type: "제대군인", carrier: "KT", count: 3921 },
            { type: "제대군인", carrier: "LG U+", count: 3211 },
            { type: "제대군인", carrier: "SKT 알뜰폰", count: 421 },
            { type: "제대군인", carrier: "KT 알뜰폰", count: 1215 },
            { type: "제대군인", carrier: "LG U+ 알뜰폰", count: 1557 },
            { type: "참여기업", carrier: "SKT", count: 28 },
            { type: "참여기업", carrier: "KT", count: 31 },
            { type: "참여기업", carrier: "LG U+", count: 23 },
            { type: "참여기업", carrier: "SKT 알뜰폰", count: 2 },
            { type: "참여기업", carrier: "KT 알뜰폰", count: 8 },
            { type: "참여기업", carrier: "LG U+ 알뜰폰", count: 3 }
        ];

        // 2. Data Processing Logic
        const carrierStats = {};
        const typeStats = {};
        let totalCount = 0;

        rawData.forEach(item => {
            // Carrier Aggregation
            carrierStats[item.carrier] = (carrierStats[item.carrier] || 0) + item.count;
            // Type Aggregation
            typeStats[item.type] = (typeStats[item.type] || 0) + item.count;
            // Total
            totalCount += item.count;
        });

        // Convert to Arrays for Chart.js
        const sortedCarriers = Object.entries(carrierStats).sort((a, b) => b[1] - a[1]);
        const sortedTypes = Object.entries(typeStats).sort((a, b) => b[1] - a[1]);

        // 3. Update DOM Elements
        document.getElementById('totalMembers').innerText = totalCount.toLocaleString();
        document.getElementById('topCarrier').innerText = sortedCarriers[0][0];
        document.getElementById('topCarrierCount').innerText = sortedCarriers[0][1].toLocaleString() + "명";
        document.getElementById('topType').innerText = sortedTypes[0][0];
        document.getElementById('topTypeCount').innerText = sortedTypes[0][1].toLocaleString() + "명";

        // Summary Table Population
        const summaryTbody = document.getElementById('summaryTableBody');
        sortedCarriers.forEach(([carrier, count]) => {
            const tr = document.createElement('tr');
            tr.className = "bg-white border-b hover:bg-gray-50";
            tr.innerHTML = `<td class="px-4 py-2 font-medium text-gray-900">${carrier}</td>
                            <td class="px-4 py-2 text-right">${count.toLocaleString()}</td>`;
            summaryTbody.appendChild(tr);
        });
        document.getElementById('summaryTotal').innerText = totalCount.toLocaleString();

        // Detailed Table Population
        const detailTbody = document.getElementById('detailTableBody');
        rawData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "bg-white border-b hover:bg-gray-50";
            tr.innerHTML = `<td class="px-6 py-4 font-medium text-gray-900">${item.type}</td>
                            <td class="px-6 py-4">${item.carrier}</td>
                            <td class="px-6 py-4 text-right">${item.count.toLocaleString()}</td>`;
            detailTbody.appendChild(tr);
        });

        // 4. Chart Configuration
        const chartColors = [
            '#ef4444', // Red (SKT ish)
            '#3b82f6', // Blue (KT ish)
            '#ec4899', // Pink (LG ish)
            '#f59e0b', // Amber
            '#10b981', // Emerald
            '#8b5cf6'  // Violet
        ];

        // Carrier Chart (Doughnut)
        new Chart(document.getElementById('carrierChart'), {
            type: 'doughnut',
            data: {
                labels: sortedCarriers.map(i => i[0]),
                datasets: [{
                    data: sortedCarriers.map(i => i[1]),
                    backgroundColor: chartColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 12, padding: 10 } }
                }
            }
        });

        // Type Chart (Bar)
        new Chart(document.getElementById('typeChart'), {
            type: 'bar',
            data: {
                labels: sortedTypes.map(i => i[0]),
                datasets: [{
                    label: '회원 수',
                    data: sortedTypes.map(i => i[1]),
                    backgroundColor: '#6366f1', // Indigo
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false } }
                }
            }
        });

    </script>
</body>
</html>
