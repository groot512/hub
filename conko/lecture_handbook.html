                detail: 'AI와 Web 3.0의 결합은 단순한 기술 교체를 넘어, 일자리, 경제 구조, 국가의 개념까지 바꾸는 거대한 물결입니다.\n\nAI 에이전트가 내 암호화폐 지갑을 이용해 다른 AI와 거래를 하고, 거대 기업의 횡포에 맞서 개인들이 DAO로 뭉쳐 자본과 데이터를 무기화하는 세상이 옵니다. 기술에 압도당하지 않고 이를 활용하기 위한 지속적인 학습과 개방적인 태도가 필요합니다.',
                events: 'Sam Altman(OpenAI CEO)이 인간 고유성을 증명하기 위해 만든 홍채 인식 기반 블록체인 프로젝트 \'월드코인(Worldcoin)\'이 바로 이 융합의 상징적 사례입니다.'
            }
        ]
    }
];

let currentChartInstance = null;
let currentPartId = 'part1';

// DOM Elements
const tabNav = document.getElementById('tabNav');
const sectionTitle = document.getElementById('sectionTitle');
const sectionSubtitle = document.getElementById('sectionSubtitle');
const sectionIntro = document.getElementById('sectionIntro');
const chartDescription = document.getElementById('chartDescription');
const cardsGrid = document.getElementById('cardsGrid');

// Modal Elements
const detailModal = document.getElementById('detailModal');
const modalIcon = document.getElementById('modalIcon');
const modalTitle = document.getElementById('modalTitle');
const modalSummary = document.getElementById('modalSummary');
const modalDetail = document.getElementById('modalDetail');
const modalEvents = document.querySelector('#modalEvents p');
const closeModalBtn = document.getElementById('closeModalBtn');
const closeModalBottomBtn = document.getElementById('closeModalBottomBtn');

function init() {
    renderTabs();
    loadPart('part1');
    setupModalListeners();
}

function renderTabs() {
    lectureData.forEach(part => {
        const btn = document.createElement('button');
        btn.className = `tab-btn px-5 py-2.5 rounded-full text-sm font-semibold border ${part.id === currentPartId ? 'active' : 'bg-white text-stone-600 border-stone-200 hover:bg-stone-100'}`;
        btn.textContent = part.tabName;
        btn.onclick = () => {
            currentPartId = part.id;
            updateTabStyles();
            loadPart(part.id);
        };
        tabNav.appendChild(btn);
    });
}

function updateTabStyles() {
    const btns = tabNav.querySelectorAll('button');
    btns.forEach((btn, index) => {
        if (lectureData[index].id === currentPartId) {
            btn.className = 'tab-btn active px-5 py-2.5 rounded-full text-sm font-semibold border border-indigo-600 bg-indigo-600 text-white shadow-md';
        } else {
            btn.className = 'tab-btn bg-white text-stone-600 px-5 py-2.5 rounded-full text-sm font-semibold border border-stone-200 hover:bg-stone-100';
        }
    });
}

function loadPart(partId) {
    const data = lectureData.find(p => p.id === partId);
    if (!data) return;

    // Fade effect for smooth transition
    const mainContent = document.getElementById('mainContent');
    mainContent.style.opacity = '0';
    
    setTimeout(() => {
        sectionTitle.textContent = data.title;
        sectionSubtitle.textContent = data.subtitle;
        sectionIntro.textContent = data.intro;
        chartDescription.textContent = data.chartDesc;
        
        renderChart(data.chart);
        renderCards(data.keywords);
        
        mainContent.style.transition = 'opacity 0.4s ease';
        mainContent.style.opacity = '1';
    }, 200);
}

function renderChart(chartData) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    
    if (currentChartInstance) {
        currentChartInstance.destroy();
    }

    Chart.defaults.font.family = "'Noto Sans KR', sans-serif";

    const config = {
        type: chartData.type,
        data: {
            labels: chartData.labels,
            datasets: chartData.datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { boxWidth: 12, padding: 20 }
                },
                title: {
                    display: true,
                    text: chartData.title,
                    font: { size: 16, weight: 'bold' },
                    padding: { top: 10, bottom: 20 }
                },
                tooltip: {
                    backgroundColor: 'rgba(28, 25, 23, 0.9)',
                    titleFont: { size: 13 },
                    bodyFont: { size: 13 },
                    padding: 10,
                    cornerRadius: 8,
                    displayColors: true
                }
            }
        }
    };

    // Specific configurations based on chart type
    if (chartData.type === 'line' || chartData.type === 'bar') {
        config.options.scales = {
            y: { beginAtZero: true, grid: { color: '#f5f5f4' } },
            x: { grid: { display: false } }
        };
    } else if (chartData.type === 'doughnut') {
        config.options.scales = {}; // Remove scales for doughnut
        config.options.cutout = '60%';
    }

    currentChartInstance = new Chart(ctx, config);
}

function renderCards(keywords) {
    cardsGrid.innerHTML = '';
    keywords.forEach((kw, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-stone-200 p-5 cursor-pointer card-hover flex flex-col h-full';
        card.innerHTML = `
            <div class="flex items-center gap-3 mb-3">
                <span class="text-3xl bg-stone-50 p-2 rounded-lg border border-stone-100">${kw.icon}</span>
                <div>
                    <h5 class="text-lg font-bold text-stone-800 leading-tight">${kw.title}</h5>
                    <span class="text-xs text-stone-400 font-medium">${kw.eng}</span>
                </div>
            </div>
            <p class="text-sm text-stone-600 flex-grow mt-2 leading-relaxed line-clamp-3">${kw.summary}</p>
            <div class="mt-4 pt-3 border-t border-stone-100 flex justify-between items-center text-xs font-semibold text-indigo-600">
                <span>자세히 보기</span>
                <span>→</span>
            </div>
        `;
        card.onclick = () => openModal(kw);
        
        // Add staggered animation entrance
        card.style.opacity = '0';
        card.style.transform = 'translateY(10px)';
        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        cardsGrid.appendChild(card);
        
        setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 50 * index);
    });
}

function openModal(kw) {
    modalIcon.textContent = kw.icon;
    modalTitle.innerHTML = `${kw.title} <span class="text-lg font-medium text-stone-400 ml-2">${kw.eng}</span>`;
    modalSummary.textContent = kw.summary;
    modalDetail.textContent = kw.detail;
    modalEvents.textContent = kw.events;
    
    detailModal.classList.remove('hidden');
    // slight delay to allow display:block to apply before animating opacity
    setTimeout(() => {
        detailModal.classList.remove('opacity-0');
        detailModal.querySelector('.bg-white').classList.remove('scale-95');
    }, 10);
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
}

function closeModal() {
    detailModal.classList.add('opacity-0');
    detailModal.querySelector('.bg-white').classList.add('scale-95');
    setTimeout(() => {
        detailModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
    }, 300); // match transition duration
}

function setupModalListeners() {
    closeModalBtn.addEventListener('click', closeModal);
    closeModalBottomBtn.addEventListener('click', closeModal);
    detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) {
            closeModal();
        }
    });
}

// Start application
window.onload = init;

</script>
</body>
</html>
