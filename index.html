  .fn{color:var(--muted); font-size:12px; word-break:break-all;}

  {g:"david", p:"david/WellRice_biz.html", t:"WellRice biz", d:"웰라이스 (사업용)"},
  {g:"david", p:"david/WellRice_info.html", t:"WellRice info", d:"웰라이스 (정보용)"},

  // ===== CREO =====
  {g:"CREO", p:"CREO/index.html", t:"index", d:"CREO 대표 페이지"},
  {g:"CREO", p:"CREO/mo.html", t:"mo", d:"CREO 모바일 페이지"},
];

const tbody = document.querySelector("#tbl tbody");
const countEl = document.getElementById("count");
let curFilter = "all", curSearch = "";

function render(){
  const rows = data.filter(d=>{
    const okF = curFilter==="all" || d.g===curFilter;
    const okS = !curSearch || (d.t+d.d+d.p+d.g).toLowerCase().includes(curSearch);
    return okF && okS;
  });
  tbody.innerHTML = rows.map(d=>`
    <tr>
      <td><span class="grp-tag">${d.g}</span></td>
      <td><a class="open" href="${encodeURI(d.p)}" target="_blank">${d.t} ↗</a><div class="fn">${d.p}</div></td>
      <td>${d.d}</td>
    </tr>`).join("");
  countEl.textContent = rows.length + " / " + data.length + "개";
}
document.getElementById("search").addEventListener("input", e=>{ curSearch=e.target.value.toLowerCase().trim(); render(); });
document.querySelectorAll(".filter-btn").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); curFilter=b.dataset.f; render();
  });
});
render();
</script>
</body>
</html>
