<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding:24px;}
  .wrap{max-width:1150px; margin:0 auto;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:20px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5;}
  #search{flex:1; min-width:200px; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px;}
  .cat-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-btn{padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:13px;}
  .filter-btn:hover{border-color:var(--accent);}
  .filter-btn.active{background:var(--accent); color:#000; font-weight:600; border-color:var(--accent);}
  #count{color:var(--muted); font-size:13px; margin-left:auto;}
  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden;}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; vertical-align:top;}
  th{background:#1c2128; white-space:nowrap;}
  tr:hover td{background:#1c2128;}
  .cat-tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; background:rgba(139,148,158,.18); color:var(--muted); white-space:nowrap;}
  .grp-tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; background:rgba(88,166,255,.15); color:var(--accent); white-space:nowrap;}
  a.open{color:var(--accent); text-decoration:none; font-weight:600;}
  a.open:hover{text-decoration:underline;}
  .fn{color:var(--muted); font-size:12px; word-break:break-all;}
  .foot{color:var(--muted); font-size:13px; text-align:center; margin-top:30px;}
  /* 보기 전환 토글 */
  .view-toggle{display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .view-toggle button{padding:8px 14px; background:var(--card); color:var(--text); border:none; cursor:pointer; font-size:13px;}
  .view-toggle button.active{background:var(--accent); color:#000; font-weight:600;}
  /* 그룹별 보기 */
  #groupView{display:none;}
  .grp-card{background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden;}
  .grp-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none;}
  .grp-head:hover{background:#1c2128;}
  .grp-head .arrow{transition:transform .15s; color:var(--muted); font-size:12px;}
  .grp-card.open .grp-head .arrow{transform:rotate(90deg);}
  .grp-head .name{font-weight:700; font-size:15px;}
  .grp-head .cnt{color:var(--muted); font-size:12px;}
  .grp-body{display:none; border-top:1px solid var(--border);}
  .grp-card.open .grp-body{display:block;}
  .grp-body a{display:flex; justify-content:space-between; gap:12px; padding:9px 16px; border-bottom:1px solid var(--border); color:var(--text); text-decoration:none; font-size:14px;}
  .grp-body a:last-child{border-bottom:none;}
  .grp-body a:hover{background:#1c2128; color:var(--accent);}
  .grp-body .d{color:var(--muted); font-size:12px; text-align:right; flex-shrink:0;}
  .cat-header{font-size:15px; font-weight:700; color:var(--accent); margin:18px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--border);}
</style>

</head>

const tbody = document.querySelector("#tbl tbody");
const groupView = document.getElementById("groupView");
const tbl = document.getElementById("tbl");
const countEl = document.getElementById("count");
const CAT_ORDER = ["주소모음","보훈","식품","서비스","블로그"];
let curCat = "all", curSearch = "", curView = "list";

function getFiltered(){
  return data.filter(d=>{
    const okC = curCat==="all" || d.c===curCat;
    const okS = !curSearch || (d.t+d.d+d.p+d.g+d.c).toLowerCase().includes(curSearch);
    return okC && okS;
  });
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// 목록 보기
function renderList(rows){
  tbody.innerHTML = rows.map(d=>`
    <tr>
      <td><span class="cat-tag">${d.c}</span></td>
      <td><span class="grp-tag">${esc(d.g)}</span></td>
      <td><a class="open" href="${encodeURI(d.p)}" target="_blank">${esc(d.t)} ↗</a><div class="fn">${esc(d.p)}</div></td>
      <td>${esc(d.d)}</td>
    </tr>`).join("");
}

// 그룹별 보기 (카테고리 → 그룹 아코디언)
function renderGroup(rows){
  const cats = {};
  rows.forEach(d=>{ (cats[d.c] = cats[d.c] || {}); (cats[d.c][d.g] = cats[d.c][d.g] || []).push(d); });
  const catKeys = CAT_ORDER.filter(c=>cats[c]).concat(Object.keys(cats).filter(c=>!CAT_ORDER.includes(c)));
  const autoOpen = (curSearch !== "");
  let html = "";
  catKeys.forEach(cat=>{
    const groups = cats[cat];
    const catTotal = Object.values(groups).reduce((a,g)=>a+g.length,0);
    html += `<div class="cat-header">${cat} · ${Object.keys(groups).length}개 그룹 / ${catTotal}개 문서</div>`;
    Object.keys(groups).sort().forEach(g=>{
      const items = groups[g];
      html += `<div class="grp-card${autoOpen?" open":""}">
        <div class="grp-head">
          <span class="arrow">▶</span>
          <span class="name">${esc(g)}</span>
          <span class="cnt">${items.length}개 페이지</span>
        </div>
        <div class="grp-body">
          ${items.map(d=>`<a href="${encodeURI(d.p)}" target="_blank"><span>${esc(d.t)}</span><span class="d">${esc(d.d)}</span></a>`).join("")}
        </div>
      </div>`;
    });
  });
  groupView.innerHTML = html;
  groupView.querySelectorAll(".grp-head").forEach(h=>{
    h.addEventListener("click", ()=> h.parentElement.classList.toggle("open"));
  });
}

function render(){
  const rows = getFiltered();
  if(curView === "list"){
    tbl.style.display = ""; groupView.style.display = "none";
    renderList(rows);
  } else {
    tbl.style.display = "none"; groupView.style.display = "block";
    renderGroup(rows);
  }
  countEl.textContent = rows.length + " / " + data.length + "개";
}

document.getElementById("search").addEventListener("input", e=>{ curSearch=e.target.value.toLowerCase().trim(); render(); });
document.querySelectorAll(".filter-btn").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); curCat=b.dataset.c; render();
  });
});
document.getElementById("btnList").addEventListener("click", ()=>{
  curView="list";
  document.getElementById("btnList").classList.add("active");
  document.getElementById("btnGroup").classList.remove("active");
  render();
});
document.getElementById("btnGroup").addEventListener("click", ()=>{
  curView="group";
  document.getElementById("btnGroup").classList.add("active");
  document.getElementById("btnList").classList.remove("active");
  render();
});
render();
</script>

</body>
</html>
